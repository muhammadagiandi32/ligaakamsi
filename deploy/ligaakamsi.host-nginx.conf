# nginx HOST di VPS — taruh di /etc/nginx/sites-available/ligaakamsi.com
# lalu: ln -s ../sites-available/ligaakamsi.com /etc/nginx/sites-enabled/
#
# Jalankan versi HTTP ini dulu, baru:
#   certbot --nginx -d ligaakamsi.com -d www.ligaakamsi.com
# Certbot akan menambahkan blok SSL dan redirect-nya sendiri.

server {
    listen 80;
    listen [::]:80;
    server_name ligaakamsi.com www.ligaakamsi.com;

    access_log /var/log/nginx/ligaakamsi.access.log;
    error_log  /var/log/nginx/ligaakamsi.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
